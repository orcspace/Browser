<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <title>Browser</title>
    <link rel="stylesheet" href="style.css" />
    <style id="custom-style"></style>
  </head>
  <body>
    <svg class="sprite" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="i-plus" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14" />
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
          <path d="m6 6 12 12M18 6 6 18" />
        </symbol>
        <symbol id="i-back" viewBox="0 0 24 24">
          <path d="m14 6-6 6 6 6" />
        </symbol>
        <symbol id="i-forward" viewBox="0 0 24 24">
          <path d="m10 6 6 6-6 6" />
        </symbol>
        <symbol id="i-reload" viewBox="0 0 24 24">
          <path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 4 4" />
        </symbol>
        <symbol id="i-sidebar" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <path d="M9 4v16" />
        </symbol>
        <symbol id="i-settings" viewBox="0 0 24 24">
          <path d="M5 7h14M5 17h14" />
          <circle cx="9" cy="7" r="3" />
          <circle cx="15" cy="17" r="3" />
        </symbol>
        <symbol id="i-shield" viewBox="0 0 24 24">
          <path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6z" />
          <path d="m8 12 3 3 5-6" />
        </symbol>
        <symbol id="i-lock" viewBox="0 0 24 24">
          <rect x="5" y="10" width="14" height="11" rx="3" />
          <path d="M8 10V7a4 4 0 0 1 8 0v3" />
        </symbol>
        <symbol id="i-pin" viewBox="0 0 24 24">
          <path d="m8 3 8 0-1 6 4 4H5l4-4zM12 13v8" />
        </symbol>
        <symbol id="i-download" viewBox="0 0 24 24">
          <path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" />
        </symbol>
        <symbol id="i-extension" viewBox="0 0 24 24">
          <path
            d="M4 4h6a3 3 0 1 1 6 0h4v6a3 3 0 1 0 0 6v4h-6a3 3 0 1 0-6 0H4z"
          />
        </symbol>
        <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 12h12" /></symbol>
        <symbol id="i-max" viewBox="0 0 24 24">
          <rect x="6" y="6" width="12" height="12" rx="1" />
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24">
          <path d="M21 13a9 9 0 0 1-10-10A9 9 0 1 0 21 13z" />
        </symbol>
        <symbol id="i-volume" viewBox="0 0 24 24">
          <path
            d="m10 5-5 4H2v6h3l5 4zM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"
          />
        </symbol>
      </defs>
    </svg>
    <aside id="sidebar">
      <div class="brand">
        <span class="ring small"></span><strong>Browser</strong
        ><button
          class="icon-button collapse"
          data-action="toggleSidebar"
          aria-label="Toggle sidebar"
          title="Toggle sidebar"
        ></button>
      </div>
      <div class="sidebar-body">
        <div class="section-label" id="pinned-label">PINNED</div>
        <div id="pinned-tabs"></div>
        <div class="section-label tabs-label">
          <span>TABS</span><span id="tab-count"></span>
        </div>
        <div id="regular-tabs"></div>
        <button class="new-tab" data-action="newTab">
          <span id="new-icon"></span><span class="label">New tab</span
          ><kbd id="new-shortcut"></kbd>
        </button>
      </div>
      <div class="sidebar-bottom">
        <div class="protection" id="protection"></div>
        <div class="utilities">
          <button
            class="icon-button"
            data-action="downloads"
            aria-label="Downloads"
            title="Downloads"
          ></button
          ><button
            class="icon-button"
            data-action="extensions"
            aria-label="Extensions"
            title="Extensions"
          ></button
          ><span class="spacer"></span
          ><button
            class="icon-button"
            data-action="settings"
            aria-label="Settings"
            title="Settings"
          ></button>
        </div>
      </div>
    </aside>
    <main id="main">
      <header id="toolbar">
        <nav>
          <button
            class="icon-button"
            id="back"
            data-action="back"
            aria-label="Go back"
          ></button
          ><button
            class="icon-button"
            id="forward"
            data-action="forward"
            aria-label="Go forward"
          ></button
          ><button
            class="icon-button"
            id="reload"
            data-action="reload"
            aria-label="Reload"
          ></button>
        </nav>
        <form id="address-form">
          <span id="address-icon"></span
          ><input
            id="address"
            aria-label="Address or search"
            placeholder="Search or enter address"
            autocomplete="off"
            spellcheck="false"
          /><span id="engine-indicator"></span>
        </form>
        <div id="window-controls">
          <button
            class="icon-button"
            data-action="minimize"
            aria-label="Minimize"
          ></button
          ><button
            class="icon-button"
            data-action="maximize"
            aria-label="Maximize"
          ></button
          ><button
            class="icon-button window-close"
            data-action="closeWindow"
            aria-label="Close window"
          ></button>
        </div>
      </header>
      <div id="viewport" class="page" aria-hidden="true"></div>
      <section id="newtab" class="page">
        <div class="newtab-content">
          <span class="ring hero-ring"></span>
          <h1>Browser<span class="period">.</span></h1>
          <p class="subtitle">A quieter place for the web.</p>
          <form id="search-form">
            <span id="search-icon"></span
            ><input
              id="search"
              aria-label="Search the web"
              placeholder="Where would you like to go?"
              autocomplete="off"
              spellcheck="false"
            /><button
              type="submit"
              aria-label="Search"
              id="search-submit"
            ></button>
          </form>
          <div id="search-hints"></div>
        </div>
        <div class="newtab-footer">
          <span id="default-engine"></span><span id="keyboard-hint"></span>
        </div>
      </section>
      <section id="error-page" class="page" hidden>
        <div class="newtab-content">
          <span class="ring hero-ring"></span>
          <h1>Let's try that again.</h1>
          <p id="page-error"></p>
          <button class="primary" data-action="reload">Reload page</button>
        </div>
      </section>
      <section id="panel" class="page" hidden></section>
    </main>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="renderer.mjs"></script>
  </body>
</html>
