// Browser AutoConfig. The first line is intentionally a comment.
try {
  const directory = Services.dirsvc.get('GreD', Components.interfaces.nsIFile);
  directory.append('browser-custom');
  const handler = Services.io.getProtocolHandler('resource').QueryInterface(Components.interfaces.nsIResProtocolHandler);
  handler.setSubstitution('browser-custom', Services.io.newFileURI(directory));
  const { Browser } = ChromeUtils.importESModule('resource://browser-custom/modules/Browser.sys.mjs');
  Browser.start();
} catch (error) {
  Components.utils.reportError('Browser initialization: ' + error);
}
