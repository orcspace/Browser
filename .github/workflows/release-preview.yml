name: Publish Windows preview
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tools/build.py
      - run: python -m pip install marionette_driver
      - run: python tests/browser_test.py --binary dist/Windows/Browser.exe
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build setup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer/windows.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          @'
          Предварительная сборка Browser на базе Firefox ESR для Windows x64.
          Скачайте Browser-Setup.exe. Electron и Node.js не используются.
          Установщик не подписан и может вызвать предупреждение Windows. Сам установщик ещё не проверен запуском на Windows. Автоматического обновления безопасности пока нет. Сборка предназначена для тестирования. Установщика для macOS в этом релизе нет.
          '@ | Set-Content release-notes.txt -Encoding utf8
          gh release create v0.3.0-preview Browser-Setup.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Browser 0.3.0 Preview (Firefox)' --notes-file release-notes.txt --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
